- id: nintendo-github-dmca-wave-2026-11
  date: 2026-11-06
  kind: takedown
  vendor: nintendo
  label: DMCA wave
  sub: recomps go missing
  title: Nintendo's DMCA wave on GitHub, and recomp repos go missing
  summary: |
    Nintendo filed four DMCA notices with GitHub on 6 November, made public on 10 November. They
    target Nintendo Switch emulators (Yuzu, Citron Neo) and Switch modchip firmware (SX Core, SX Lite,
    Picofly, HWFLY); GitHub took down the Picofly notice's whole network of 144 repositories. None of
    the notices names a static recompilation or a source port.

    In the same days, decomp and recomp developers reported repositories being taken down, on GitLab as
    well as GitHub, and advised against keeping GitHub as a project's only home. Mr. Sujano's news show
    covered the takedowns of game decomps and recomps on 12 November. Seven projects listed here went
    missing from GitHub between 2 and 11 November. GitHub shows none of them as blocked under the DMCA:
    the repos, or their owners' whole accounts, are simply gone, so why each one went is not known.
  sources:
    - label: "GitHub DMCA notice: Switch emulators"
      url: https://github.com/github/dmca/blob/master/2026/11/2026-11-06-nintendo-4.md
    - label: "GitHub DMCA notice: modchip firmware"
      url: https://github.com/github/dmca/blob/master/2026/11/2026-11-06-nintendo-2.md
    - label: GBAtemp
      url: https://gbatemp.net/news/nintendo-dmca-notice-takes-down-144-picofly-switch-repositories.686453/
    - label: Video Games Chronicle
      url: https://www.videogameschronicle.com/news/nintendos-battle-against-piracy-continues-with-a-dmca-takedown-on-switch-mod-chip-firmware/
    - label: "Mr. Sujano: Takedowns for Game Decomps and Recomps"
      url: https://www.youtube.com/watch?v=CsrUy_Ze9PI
    - label: Mr. Sujano's sources for that episode
      url: https://github.com/MrSujano/Sources/releases/tag/2026.11.12
    - label: "r/decomps: don't make GitHub your only home"
      url: https://www.reddit.com/r/decomps/comments/1xkop2h/psa_dont_make_github_your_only_home_for_decomp/
    - label: "recomp.party: listed projects gone from GitHub"
      url: https://recomp.party/?status=gone#all-games

- id: claude-code-game-recreation-rule
  date: 2026-10-27
  kind: policy
  vendor: anthropic
  label: Recomp nerf
  title: Claude Code steers away from recreating existing games
  summary: |
    Anthropic added two sentences to Claude Code's system prompt for Opus 5.5: build original games,
    games in a genre and games from the user's own designs and assets, but not a recreation of a
    specific existing game, even if it is renamed or called original. The rule is served from
    Anthropic's side and can't be switched off. It was first reported on 27 October; Anthropic
    confirmed the rule, though not the date, on 30 October.

    Anthropic said the change is meant to keep Claude from being used to infringe IP, that original
    and genre games should keep working, and that it plans to refine the rule. Developers reported
    that modding, debugging and similar work was caught by it too.
  sources:
    - label: Game Developer
      url: https://www.gamedeveloper.com/programming/anthropic-appears-to-have-ordered-ai-tool-claude-to-stop-remaking-video-games
    - label: VideoCardz
      url: https://videocardz.com/newz/anthropic-restricts-claude-code-from-recreating-existing-games-developers-report-blocked-projects

