# recomp.party — outside events drawn on the release timeline as dashed lines.
#
# Many recomps and ports are now written with AI coding agents, so model releases and policy
# changes that touch game work are marked for context. A line marks a date, not a cause:
# keep `summary` to what happened, with a source for every claim.
#
# Fields: see Milestone in data/schema.ts. Above the timeline: the vendor's logo, `label`
# (the short name, without "Claude") and, if it says something the name doesn't, `sub`.

- id: claude-code-game-recreation-rule
  date: 2026-10-27
  kind: policy
  vendor: anthropic
  label: Recomp nerf
  title: Claude Code steers away from recreating existing games
  summary: |
    Anthropic added two sentences to Claude Code's system prompt for Opus 5.5: build original games,
    games in a genre and games from the user's own designs and assets, but not a recreation of a
    specific existing game, even if it is renamed or called original. The rule is served from
    Anthropic's side and can't be switched off. It was first reported on 27 October; Anthropic
    confirmed the rule, though not the date, on 30 October.

    Anthropic said the change is meant to keep Claude from being used to infringe IP, that original
    and genre games should keep working, and that it plans to refine the rule. Developers reported
    that modding, debugging and similar work was caught by it too.
  sources:
    - label: Game Developer
      url: https://www.gamedeveloper.com/programming/anthropic-appears-to-have-ordered-ai-tool-claude-to-stop-remaking-video-games
    - label: VideoCardz
      url: https://videocardz.com/newz/anthropic-restricts-claude-code-from-recreating-existing-games-developers-report-blocked-projects

