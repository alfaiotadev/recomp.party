name: Fetch data

# Refresh data/snapshot.json from the GitHub API. A finished run triggers "Deploy site".
on:
  push:
    branches: [main]
    paths: [data/projects.yaml] # new entries get release data right after a merge
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run validate
      - name: Commit snapshot if it changed
        run: |
          git diff --quiet data/snapshot.json data/stars.json && { echo "No changes."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/stars.json
          git commit -m "data: refresh snapshot"
          git push
