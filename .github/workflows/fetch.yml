name: Fetch data

# Refresh data/snapshot.json from the GitHub API, and data/games.json + public/covers from Wikidata and IGDB.
# A finished run triggers "Deploy site".
on:
  push:
    branches: [main]
    paths: [data/projects.yaml] # new entries get release data right after a merge
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run games
        continue-on-error: true # Wikidata/IGDB trouble must not hold back the GitHub refresh
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      - run: npm run ai
        continue-on-error: true # a slow or failing commit scan must not hold back the release refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run validate
      - name: Commit data if it changed
        run: |
          git add data/snapshot.json data/stars.json data/games.json data/ai.json public/covers
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh snapshot"
          # main often moves during the run (merges, discovery); only this job writes these files, so a rebase is safe.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
