name: Check suggestion

# When someone suggests a project via the issue form, classify the linked repo(s) and open a PR.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: suggestion-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'suggestion')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Extract repo links from the issue
        id: repos
        env:
          ISSUE_BODY: ${{ github.event.issue.body }} # untrusted: only ever read from the environment
        run: |
          repos=$(npx tsx -e 'import { githubSlugs } from "./scripts/sources/index.ts"; console.log(githubSlugs(process.env.ISSUE_BODY ?? "").slice(0, 5).join(" "))')
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
      - if: steps.repos.outputs.repos == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment ${{ github.event.issue.number }} --body "Thanks! I couldn't find a github.com/owner/repo link in this issue — could you add one?"
      - if: steps.repos.outputs.repos != ''
        id: run
        run: npx tsx scripts/discover.ts --only ${{ steps.repos.outputs.repos }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      - if: steps.repos.outputs.repos != ''
        run: npm run validate && npm run build
      - if: steps.repos.outputs.repos != ''
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: suggestion/issue-${{ github.event.issue.number }}
          delete-branch: true
          add-paths: |
            data/projects.yaml
            data/rejected.yaml
          commit-message: "data: suggestion from #${{ github.event.issue.number }}"
          title: "Suggestion from #${{ github.event.issue.number }}"
          body-path: tmp/discover-report.md
          labels: suggestion
      - if: steps.repos.outputs.repos != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            cat tmp/discover-report.md
            echo
            if [ -n "$PR_URL" ]; then echo "Proposed change: $PR_URL — a maintainer will review it."; else echo "No change was proposed automatically; a maintainer will take a look."; fi
          } > tmp/comment.md
          gh issue comment ${{ github.event.issue.number }} --body-file tmp/comment.md
